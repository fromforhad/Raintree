<!DOCTYPE html>
<html>
<head>
	<title>Routine Scraper v1!</title>
	<link rel="stylesheet"href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"></link rel>
	<style>
		.container {
    padding: 16px;
    margin: 16px;
}
	</style>
</head>
<body>

<div class="container">
<h1>Welcome to Project Raintree</h1>
<select id="batch">
	<option value=""></option>
	<option value="61">61</option>
</select>

<select id="section">
	<option value=""></option>
	<option value="C">C</option>
</select>

<button onclick="getSchedule()">Get Schedule</button>
<p id="schedule"></p>
</div>

<script type="text/javascript">
	const API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" 
    ? "http://localhost:5000" 
    : "https://raintree-xnlz.onrender.com";

	function getSchedule() {
		const batch = document.getElementById('batch').value;
		const section = document.getElementById('section').value;

		if(batch === '' && section === '') {
		document.getElementById('schedule').innerHTML = "Please select an option.";
		return;
	}

fetch(`${API_URL}/schedule/${batch}/${section}`)
    .then(response => response.json())
    .then(data => {

        let classes = '';
        data.forEach(daySchedule => {

            if (daySchedule.isOffDay) {
                classes += `<strong>${daySchedule.day}</strong>: No classes today! 🎉<hr><br>`;
            } else {
                daySchedule.classes.forEach(item => {
                    classes += item.day + '<br>' + item.batch + '<br>' + item.section + '<br>' + item.time + '<br>' + item.subject + '<br>' + item.title + '<br>' + item.room + '<br>' + item.faculty + '<br>' + '<br>';
                });
            }
        });

        document.getElementById('schedule').innerHTML = classes;
    });

	}
</script>
</body>
</html>
