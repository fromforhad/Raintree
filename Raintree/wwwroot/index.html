<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#415f91">
  <title>Raintree - A Routine Scraper for Uttara University</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Outlined"
    rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="./Assets/Icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="./Assets/Icons/leaf192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./Assets/Icons/leaf512.png">
  <link rel="apple-touch-icon" href="./Assets/Icons/leaf192.png">
  <script src="./script.js" defer></script>
</head>

<body>

  <header>
    <h1>Raintree</h1>
    <p>A personalized routine scraper so you don't have to look at that giant PDF again!</p><br>
    <div class="subtitle" id="subtitle">Select your batch</div>
  </header>

  <!-- The routine table -->
  <div class="chip-row" id="batchRow"></div>
  <div class="chip-row hidden" id="sectionRow"></div>

  <div class="schedule-wrap" id="scheduleWrap">
    <div class="message" id="scheduleMessage">Select a batch and section to display the routine</div>
  </div><br>

  <!-- View original routine -->
  <div class="schedule-wrap callout-flex">
    <span class="material-symbols-outlined class-room callout-icon-size">
      picture_as_pdf
    </span>
    <div class="class-cell">
      <span class="subtitle callout-text-reset">View original routine</span>
      <a href="https://drive.google.com/file/d/1QICMnlpMJQlN5Qy9IwJ3WPIeAlgwMAdD/view?usp=sharing" target="_blank"
        rel="noopener noreferrer" class="callout-link">
        Batch-Wise BSc in CSE Day Class Routine Summer 26-1-1.pdf
      </a>
    </div>
  </div>
  <footer><a href="https://github.com/fromforhad">@fromforhad</a> | v1.0</footer>

</body>

</html>
