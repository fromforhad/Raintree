<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raintree - A Routine Scraper for Uttara University</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:opsz,wght@8..144,400..700&family=Material+Symbols+Outlined"
    rel="stylesheet">
  <script src="script.js" defer></script>
</head>

<body>

  <header>
    <h1>Raintree</h1>
    <p>A personalized routine scraper so you don't have to look at that big PDF again.</p><br>
    <div class="subtitle" id="subtitle">Select your batch</div>
  </header>

  <div class="chip-row" id="batchRow"></div>
  <div class="chip-row hidden" id="sectionRow"></div>

  <div class="schedule-wrap" id="scheduleWrap">
    <div class="message" id="scheduleMessage">Select a batch and section to display the routine</div>
  </div>

  <footer>Developed by <a href="https://github.com/fromforhad">@fromforhad</a></footer>

</body>

</script>

</html>
